# Every time a pull request is merged into main:
#   - adds 1 to the last number of the game version (v0.0.0.1 → v0.0.0.2)
#   - adds the pull request's author to the contributors on the final screen
#
# It uses pull_request_target so it also gets write access for pull requests
# opened from forks. That is safe here because it only checks out main after
# the merge and never runs code from the pull request branch.

name: Bump version and credit contributor on merge

on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Merges that land close together are bumped one at a time, in order.
concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Add 1 to the version
        run: node scripts/bump-version.js

      # The username comes from the event through an environment variable,
      # never pasted into the shell, and the script validates it.
      - name: Add the author to the contributors
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/add-contributor.js "$AUTHOR"

      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION index.html README.md contributors.js
          git commit -m "Bump version to v$(cat VERSION) after #${PR_NUMBER}"
          # main may have moved while this ran; rebase and retry a few times.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "Could not push the version bump to main." >&2
          exit 1
